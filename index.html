<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UNLOCK · 추상화와 알고리즘</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%93%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">본문 바로가기</a>

  <!-- 살아있는 배경: 둥둥 떠다니는 도형 (움직임 줄이기 설정 시 정지) -->
  <div class="bg-deco" aria-hidden="true">
    <span class="deco d1">🔺</span>
    <span class="deco d2">🟦</span>
    <span class="deco d3">⭐</span>
    <span class="deco d4">🟣</span>
    <span class="deco d5">🔶</span>
    <span class="deco d6">💡</span>
    <span class="deco d7">🧩</span>
    <span class="deco d8">✨</span>
  </div>

  <!-- 상단 바 -->
  <header class="topbar" role="banner">
    <button id="btn-home" class="topbar-btn" title="처음으로" aria-label="처음 화면으로"><span class="ico" aria-hidden="true">🏠</span><span class="lbl">처음</span></button>
    <div class="topbar-title" id="topbar-title">UNLOCK</div>
    <div class="topbar-tools">
      <button id="btn-fullscreen" class="topbar-btn" title="전체 화면" aria-label="전체 화면 켜기/끄기"><span class="ico" aria-hidden="true">⛶</span><span class="lbl">전체화면</span></button>
      <button id="btn-sound" class="topbar-btn" title="소리" aria-pressed="true" aria-label="소리 켜기/끄기"><span class="ico" aria-hidden="true">🔊</span><span class="lbl">소리</span></button>
      <button id="btn-motion" class="topbar-btn" title="움직임 줄이기" aria-pressed="false" aria-label="움직임 줄이기 켜기/끄기"><span class="ico" aria-hidden="true">🎞</span><span class="lbl">움직임</span></button>
    </div>
  </header>

  <main id="main" class="screen-host" role="main" aria-live="polite">
    <!-- 화면들이 여기에 렌더링됩니다 -->
  </main>

  <footer class="footbar" role="contentinfo">
    <span>학습 자료 출처: 최재혁, 「퍼즐을 이용한 창의성 교육」 (신라대학교, 2013) · 2022 개정 중학교 정보</span>
    <span>만든이 : 정예진</span>
  </footer>

  <!-- 해설/모달 영역 -->
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="assertive"></div>

  <script type="module" src="src/app.js"></script>
</body>
</html>
