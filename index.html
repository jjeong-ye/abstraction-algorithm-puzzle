<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>퍼즐 탐험대 · 추상화와 알고리즘</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">본문 바로가기</a>

  <!-- 상단 바 -->
  <header class="topbar" role="banner">
    <button id="btn-home" class="topbar-btn" title="처음으로" aria-label="처음 화면으로">🏠 처음</button>
    <div class="topbar-title" id="topbar-title">퍼즐 탐험대</div>
    <div class="topbar-tools">
      <button id="btn-fullscreen" class="topbar-btn" aria-label="전체 화면 켜기/끄기">⛶ 전체화면</button>
      <button id="btn-sound" class="topbar-btn" aria-pressed="true" aria-label="소리 켜기/끄기">🔊 소리</button>
      <button id="btn-motion" class="topbar-btn" aria-pressed="false" aria-label="움직임 줄이기 켜기/끄기">🎞 움직임</button>
      <button id="btn-teacher" class="topbar-btn" aria-pressed="false" aria-label="교사 모드 켜기/끄기(코드 필요)">🎓 교사</button>
    </div>
  </header>

  <main id="main" class="screen-host" role="main" aria-live="polite">
    <!-- 화면들이 여기에 렌더링됩니다 -->
  </main>

  <footer class="footbar" role="contentinfo">
    <span>학습 자료 출처: 최재혁, 「퍼즐을 이용한 창의성 교육」 (신라대학교, 2013) · 2022 개정 중학교 정보</span>
  </footer>

  <!-- 해설/모달 영역 -->
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="assertive"></div>

  <script type="module" src="src/app.js"></script>
</body>
</html>
