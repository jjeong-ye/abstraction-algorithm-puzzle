<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>UNLOCK · 라이브 현황판</title>
<style>
  :root{
    --bg:#1b1530; --bg2:#241a3f; --ink:#fff; --gold:#ffd43b;
    --p1:#ff8c42; --p2:#4dabf7; --p3:#51cf66; --p4:#9775fa;
    --font:"Jua","맑은 고딕","Malgun Gothic",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font);background:radial-gradient(circle at 30% 10%,var(--bg2),var(--bg));color:var(--ink);overflow:hidden;height:100vh;display:flex;flex-direction:column}

  header{display:flex;align-items:center;gap:14px;padding:14px 24px;background:rgba(0,0,0,.25);border-bottom:2px solid rgba(255,255,255,.08)}
  header h1{font-size:1.8rem;letter-spacing:1px}
  header .lock{font-size:2rem}
  header .status{margin-left:auto;font-size:1rem;opacity:.8}
  .hbtn{margin-left:14px;background:rgba(255,255,255,.12);color:#fff;border:2px solid rgba(255,255,255,.25);border-radius:10px;padding:8px 14px;font-size:1rem;font-weight:800;cursor:pointer;font-family:var(--font)}
  .hbtn:hover{background:rgba(255,255,255,.22)}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#888;margin-right:6px;vertical-align:middle}
  .dot.on{background:var(--p3);box-shadow:0 0 8px var(--p3)}

  /* 새로 들어온 항목만 '쏙 들어오며 반짝' 강조 */
  .item.just-in{ animation: justIn 1.8s ease; }
  @keyframes justIn{
    0%{ transform:translateY(-18px) scale(1.05); opacity:0; box-shadow:0 0 0 3px var(--gold); background:rgba(255,212,59,.40); }
    35%{ opacity:1; background:rgba(255,212,59,.32); }
    100%{ transform:none; box-shadow:none; background:rgba(0,0,0,.22); }
  }

  main{flex:1;display:grid;grid-template-columns:1.4fr 1fr;gap:20px;padding:20px 24px;min-height:0}
  .panel{background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.10);border-radius:18px;padding:16px 18px;min-height:0;display:flex;flex-direction:column}
  .panel h2{font-size:1.3rem;margin-bottom:10px;color:var(--gold)}
  .list{overflow:hidden;display:flex;flex-direction:column;gap:8px}
  .item{display:flex;align-items:center;gap:14px;padding:14px 16px;background:rgba(0,0,0,.22);border-radius:12px;font-size:1.5rem}
  .item .who{font-weight:800}
  .item .what{opacity:.9}
  .item .rm{margin-left:auto;color:var(--gold);font-weight:800}
  @keyframes pop{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}

  .rank .row{display:flex;align-items:center;gap:12px;padding:10px 12px;font-size:1.3rem;border-radius:12px}
  .rank .row:nth-child(odd){background:rgba(255,255,255,.05)}
  .rank .medal{width:38px;text-align:center;font-size:1.5rem}
  .rank .nm{font-weight:800}
  .rank .cnt{margin-left:auto;color:var(--gold);font-weight:800}
  .rank .bar{flex:1;height:12px;background:rgba(255,255,255,.10);border-radius:8px;overflow:hidden;margin:0 10px}
  .rank .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--p2),var(--p3))}

  .setup{position:fixed;inset:0;background:rgba(10,7,20,.92);display:flex;align-items:center;justify-content:center;z-index:50}
  .setup .box{background:#241a3f;border:2px solid rgba(255,255,255,.15);border-radius:16px;padding:28px;max-width:520px;width:92%}
  .setup h3{color:var(--gold);margin-bottom:12px;font-size:1.4rem}
  .setup label{display:block;margin:12px 0 4px;font-size:1rem}
  .setup input{width:100%;padding:12px;border-radius:10px;border:2px solid #4a3d6b;background:#1b1530;color:#fff;font-size:1.05rem;font-family:var(--font)}
  .setup button{margin-top:18px;width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(90deg,var(--p1),var(--p4));color:#fff;font-size:1.2rem;font-weight:800;cursor:pointer;font-family:var(--font)}
  .setup p{opacity:.7;font-size:.9rem;margin-top:10px;line-height:1.5}
  .empty{opacity:.5;font-size:1.1rem;padding:20px;text-align:center}
</style>
</head>
<body>
  <header>
    <span class="lock">🔓</span>
    <h1>UNLOCK 라이브 현황판</h1>
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">연결 대기</span> · <span id="classLabel"></span></div>
    <button id="btnClass" class="hbtn">⚙️ 방 코드</button>
  </header>

  <main>
    <section class="panel">
      <h2>🔓 최근 돌파</h2>
      <div class="list" id="recent"><div class="empty">아직 열린 문이 없어요. 학생들이 문제를 풀면 여기에 나타나요!</div></div>
    </section>
    <section class="panel">
      <h2>🏆 많이 연 순위</h2>
      <div class="rank" id="rank"><div class="empty">-</div></div>
    </section>
  </main>

  <!-- 최초 1회 설정 -->
  <div class="setup" id="setup">
    <div class="box">
      <h3>🔴 현황판 설정</h3>
      <label for="url">Apps Script 웹앱 URL (.../exec)</label>
      <input id="url" placeholder="https://script.google.com/macros/s/.../exec" />
      <label for="code">우리 반 코드 (예: 2-1)</label>
      <input id="code" placeholder="2-1" />
      <button onclick="startBoard()">현황판 시작 ▶</button>
      <p>설정은 이 브라우저에 저장돼요. 다음부터는 자동 연결됩니다. (오른쪽 위 상태표시로 연결 확인)</p>
    </div>
  </div>

<script>
  // ====== 설정 (여기 값을 채우면 설정창을 건너뜁니다) ======
  let API_URL = "https://script.google.com/macros/s/AKfycby5YfKc5wfScRZdI45GOQ_fBpZGGaoK1MWD4Ud-NrxCaAUlqUYmSxqMpA-5FgTqlKoc2g/exec";
  let CLASS_CODE = "2-1";   // 반 (학년-반)
  let GROUP = "";           // 방 코드(교사별 네임스페이스). ?g= 로 전달됨
  // 서버에서 조회할 코드 = 방 코드 하나 (반/학교 모두 이걸로 구분)
  function feedCode(){ return GROUP || CLASS_CODE; }

  const POLL_MS = 2000;  // 새로고침 주기 (2초 = 거의 실시간 느낌)
  const SESSION = "today";  // "today"=오늘 기록만(자동 초기화·권장) / "all"=전체 누적
  const LS = "unlock-board-cfg";

  // 표시 시작 시각(since). "today"면 오늘 자정 이후만 보여줌 → 날짜 바뀌면 자동 리셋 효과
  function sinceMs(){ return SESSION === "today" ? new Date(new Date().setHours(0,0,0,0)).getTime() : 0; }

  let lastSeq = 0;       // 지금까지 본 마지막 이벤트 번호
  let firstLoad = true;  // 첫 로드는 강조 없이 목록만 채움
  let newSeqs = new Set(); // 이번 갱신에 새로 들어온 이벤트(강조용)
  const recent = [];     // 최근 목록(최신이 앞)

  // 저장된 설정 불러오기
  (function init(){
    try{
      const saved = JSON.parse(localStorage.getItem(LS) || "{}");
      if(!API_URL && saved.url) API_URL = saved.url;
      if(!CLASS_CODE && saved.code) CLASS_CODE = saved.code;
      if(saved.group) GROUP = saved.group;
    }catch{}
    // 주소로 넘어온 값이 최우선 (교사 모드에서 현황판 열 때 자동 전달)
    const qp = new URLSearchParams(location.search);
    const urlApi = qp.get("api");
    if(urlApi){ API_URL = urlApi.trim(); }   // 고급: 자기 백엔드 연결
    const urlGroup = qp.get("g");
    if(urlGroup){ GROUP = urlGroup.trim(); } // 이 교사 방 코드
    const urlClass = qp.get("class");
    if(urlClass){ CLASS_CODE = urlClass.trim(); }
    if(urlApi || urlGroup || urlClass){ try{ localStorage.setItem(LS, JSON.stringify({ url: API_URL, code: CLASS_CODE, group: GROUP })); }catch{} }
    if(API_URL){ hideSetup(); begin(); }
  })();

  function startBoard(){
    API_URL = document.getElementById("url").value.trim();
    CLASS_CODE = document.getElementById("code").value.trim();
    if(!API_URL){ alert("웹앱 URL을 입력하세요"); return; }
    localStorage.setItem(LS, JSON.stringify({ url: API_URL, code: CLASS_CODE }));
    hideSetup(); begin();
  }
  function hideSetup(){ document.getElementById("setup").style.display = "none"; }
  function begin(){
    updateClassLabel();
    poll(); setInterval(poll, POLL_MS);
  }
  function updateClassLabel(){
    document.getElementById("classLabel").textContent = (GROUP ? "🔑 " + GROUP : (CLASS_CODE || "전체")) + (SESSION === "today" ? " · 오늘 기록만" : " · 전체 기록");
  }

  // 다른 방 코드로 전환 (프로젝터에서 클릭)
  function changeClass(){
    const c = prompt("현황판에 표시할 방 코드를 입력하세요", GROUP || "");
    if(c === null) return;
    GROUP = c.trim();
    localStorage.setItem(LS, JSON.stringify({ url: API_URL, code: CLASS_CODE, group: GROUP }));
    // 화면 초기화 후 새 방 기록 다시 읽기
    lastSeq = 0; firstLoad = true; recent.length = 0; newSeqs = new Set();
    document.getElementById("recent").innerHTML = '<div class="empty">불러오는 중...</div>';
    document.getElementById("rank").innerHTML = '<div class="empty">-</div>';
    updateClassLabel();
    poll();
  }
  document.getElementById("btnClass").addEventListener("click", changeClass);

  async function poll(){
    try{
      const q = new URLSearchParams({ action:"feed", code: feedCode(), since: String(sinceMs()) });
      const res = await fetch(API_URL + "?" + q.toString(), { cache:"no-store" });
      const data = await res.json();
      setStatus(true);
      handle(data.events || []);
      renderRank(data.rank || []);
    }catch(err){
      setStatus(false);
    }
  }

  function setStatus(ok){
    document.getElementById("dot").className = "dot" + (ok ? " on" : "");
    document.getElementById("statusText").textContent = ok ? "연결됨" : "연결 오류(재시도 중)";
  }

  function handle(events){
    // 새 이벤트만 골라내기
    const fresh = events.filter(ev => ev.seq > lastSeq);
    if(events.length) lastSeq = Math.max(lastSeq, ...events.map(ev => ev.seq));

    if(firstLoad){
      // 첫 화면: 강조 없이 최근 목록만 채움
      events.slice(-12).reverse().forEach(pushRecent);
      newSeqs = new Set();
      renderRecent();
      firstLoad = false;
      return;
    }
    if(fresh.length){
      newSeqs = new Set(fresh.map(ev => ev.seq));  // 방금 들어온 것 강조
      fresh.forEach(pushRecent);
      renderRecent();
    }
  }

  function label(ev){
    const room = ev.room ? (ev.room + "번 문") : "문";
    const w = ev.world || "";
    return { name: ev.name || "익명", where: (w ? w + " · " : "") + room, title: ev.title || "" };
  }

  function pushRecent(ev){ recent.unshift(ev); if(recent.length > 14) recent.pop(); }
  function renderRecent(){
    const host = document.getElementById("recent");
    if(!recent.length){ host.innerHTML = '<div class="empty">아직 열린 문이 없어요.</div>'; return; }
    host.innerHTML = "";
    recent.forEach(ev => {
      const L = label(ev);
      const it = document.createElement("div");
      it.className = "item" + (newSeqs.has(ev.seq) ? " just-in" : "");
      it.innerHTML = `<span class="k">🔓</span><span class="who">${esc(L.name)}</span>
        <span class="what">${esc(L.title || L.where)}</span><span class="rm">${esc(L.where)}</span>`;
      host.appendChild(it);
    });
  }

  function renderRank(rank){
    const host = document.getElementById("rank");
    if(!rank.length){ host.innerHTML = '<div class="empty">-</div>'; return; }
    const max = rank[0].count || 1;
    const medals = ["🥇","🥈","🥉"];
    host.innerHTML = "";
    rank.forEach((r, i) => {
      const row = document.createElement("div");
      row.className = "row";
      row.innerHTML = `<span class="medal">${medals[i] || (i+1)}</span>
        <span class="nm">${esc(r.name)}</span>
        <span class="bar"><i style="width:${Math.round(r.count/max*100)}%"></i></span>
        <span class="cnt">${r.count}개</span>`;
      host.appendChild(row);
    });
  }

  function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
</script>
</body>
</html>
